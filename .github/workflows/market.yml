name: market-data

on:
  schedule:
    - cron: '*/10 * * * *'   # 10분마다 (GitHub 사정으로 몇 분 늦어질 수 있어요)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 이전 데이터 받아오기
        run: |
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/market-data"
          curl -fsSL "$BASE/market.json" -o prev.json || true

      - name: 시세 수집
        id: collect
        continue-on-error: true
        env:
          PREV_FILE: prev.json
          OUT_FILE: market.json
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node collect.mjs

      - name: market-data 브랜치로 게시 (공개 시세만, 최신 상태 1개만 유지)
        if: hashFiles('market.json') != ''
        run: |
          mkdir -p /tmp/out && cp market.json /tmp/out/market.json
          cd /tmp/out
          git init -q -b market-data
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add .
          git commit -q -m "update $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" market-data

      - name: 수집 실패 표시
        if: steps.collect.outcome == 'failure'
        run: echo "::error::수집 단계에서 오류가 있었어요. 위 '시세 수집' 로그를 확인하세요." && exit 1
